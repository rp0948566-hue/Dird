[workspace]
members = [
  "crates/retinacare-domain",
  "crates/retinacare-persistence",
  "crates/retinacare-reports",
  "crates/retinacare-ai-bridge",
  "crates/retinacare-app",
  "crates/retinacare-ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
hex = "0.4"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
# Pinned pre-release: ONNX Runtime 1.31 via `download-binaries` (approved 2026-10-27).
# Default features minus `tls-native`: this host has no OpenSSL headers, so the
# downloader uses rustls instead (`tls-rustls`).
ort = { version = "=2.0.0-rc.15", default-features = false, features = [
  "std",
  "ndarray",
  "tracing",
  "download-binaries",
  "tls-rustls",
  "copy-dylibs",
  "api-31",
] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
