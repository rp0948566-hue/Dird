[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retinacare-ai"
version = "0.1.0"
description = "Local JSONL worker for the RetinaCare native desktop application"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gpu = ["torch>=2.4"]
images = ["Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]
